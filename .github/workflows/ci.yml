name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check colab_delegate tests
      - name: Test (no GPU, no Colab; real supervisor runs locally, Colab CLI is faked)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -ra -o faulthandler_timeout=300 2>&1 | tee pytest.log
        env:
          GIT_CONFIG_GLOBAL: /dev/null
      - name: Failure summary (visible without log access)
        if: failure()
        shell: bash
        run: |
          { echo '### pytest short summary'; echo '```'; grep -E "^(FAILED|ERROR)|short test summary|passed|failed" pytest.log | tail -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
